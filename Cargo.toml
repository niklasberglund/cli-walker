[package]
name = "cli-walker"
version = "0.1.0"
edition = "2024"
description = "Terminal dashboard and session logger for the Kingsmith WalkingPad A1 Pro"
license = "MIT"
repository = "https://github.com/niklasberglund/cli-walker"
publish = false

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.34"
jiff = "0.2.43"
quick-xml = "0.42.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
uuid = "1.29.2"
webbrowser = "1.2.7"

[dev-dependencies]
insta = "1.49.0"
portable-pty = "0.9.0"
vt100 = "0.18.1"
wiremock = "0.6.5"
