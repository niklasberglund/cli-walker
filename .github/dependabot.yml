version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Matches the 7-day minimum publish age in .cargo/config.toml.
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # release.yml is generated by dist; regenerate it with `dist generate` instead.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      github-actions:
        patterns: ["*"]
